name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Write project files
        run: |
          mkdir -p www
          cat > package.json <<'END_OF_PKG'
          {
            "name": "personal-bank-ios",
            "version": "1.0.0",
            "private": true,
            "description": "بنك المعلومات الشخصية — تطبيق iOS",
            "dependencies": {
              "@aparajita/capacitor-biometric-auth": "^9.0.0",
              "@capacitor/cli": "^8.0.0",
              "@capacitor/core": "^8.0.0",
              "@capacitor/filesystem": "^8.0.0",
              "@capacitor/ios": "^8.0.0",
              "@capacitor/share": "^8.0.0",
              "@capacitor/status-bar": "^8.0.0"
            }
          }
          END_OF_PKG
          cat > capacitor.config.json <<'END_OF_CFG'
          {
            "appId": "com.example.personalbank",
            "appName": "بنك المعلومات",
            "webDir": "www",
            "backgroundColor": "#075846",
            "ios": {
              "contentInset": "never"
            },
            "plugins": {
              "StatusBar": {
                "style": "DARK"
              }
            }
          }
          END_OF_CFG
          cat > make_icon.py <<'END_OF_ICON'
          from PIL import Image, ImageDraw
          S=4; N=1024*S
          im=Image.new("RGB",(N,N),(7,88,70))
          d=ImageDraw.Draw(im)
          k=N/512
          r=lambda x:x*k
          d.ellipse([r(62),r(62),r(450),r(450)],outline=(217,170,50),width=int(r(8)))
          d.rounded_rectangle([r(158),r(142),r(354),r(369)],radius=r(34),fill=(255,255,255))
          d.ellipse([r(215),r(193),r(297),r(275)],fill=(7,88,70))
          d.rectangle([r(225),r(262),r(287),r(327)],fill=(7,88,70))
          im.resize((1024,1024),Image.LANCZOS).save("AppIcon-1024.png")
          END_OF_ICON
          cat > patch-ios.sh <<'END_OF_PATCH'
          set -euo pipefail
          PLIST="ios/App/App/Info.plist"
          PB=/usr/libexec/PlistBuddy
          setstr () { $PB -c "Set :$1 $2" "$PLIST" 2>/dev/null || $PB -c "Add :$1 string $2" "$PLIST"; }
          setbool () { $PB -c "Set :$1 $2" "$PLIST" 2>/dev/null || $PB -c "Add :$1 bool $2" "$PLIST"; }
          setstr NSFaceIDUsageDescription "يستخدم التطبيق Face ID لحماية بيانات الموظفين."
          setstr NSCameraUsageDescription "يستخدم التطبيق الكاميرا لتصوير الكتب الرسمية وإرفاقها."
          setstr NSPhotoLibraryUsageDescription "يستخدم التطبيق الصور لإرفاق الكتب الرسمية."
          setbool ITSAppUsesNonExemptEncryption false
          for f in ios/App/App/Assets.xcassets/AppIcon.appiconset/*.png; do cp AppIcon-1024.png "$f"; done
          END_OF_PATCH
          cat > www/index.html <<'END_OF_INDEX_FILE'
          <!doctype html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <meta name="theme-color" content="#075846">
          <meta name="apple-mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
          <meta name="apple-mobile-web-app-title" content="بنك المعلومات">
          <link rel="manifest" href="manifest.webmanifest">
          <link rel="apple-touch-icon" href="icons/icon-192.png">
          <title>بنك المعلومات الشخصية | نظام الإدارة</title>
          <style>
          :root{--p:#075846;--p2:#0d755f;--gold:#d9aa32;--bg:#f3f6f5;--card:#fff;--text:#17211f;--muted:#71807c;--line:#e0e7e4;--danger:#b42318;--shadow:0 8px 28px #153b3412}
          *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Tahoma,sans-serif}
          button,input,select,textarea{font:inherit}button{cursor:pointer}
          header{background:linear-gradient(135deg,#043f35,#0b715d);color:#fff;padding:20px 5%;box-shadow:0 4px 18px #0002}
          .head{max-width:1180px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{display:flex;align-items:center;gap:13px}.logo{width:55px;height:55px;border:2px solid #e9c45a;border-radius:50%;display:grid;place-items:center;font-size:25px;background:#ffffff14}
          h1{margin:0;font-size:24px}.head p{margin:5px 0 0;color:#d8eeea;font-size:13px}.head button{background:#ffffff18;color:#fff;border:1px solid #ffffff44;border-radius:9px;padding:10px 14px}
          .wrap{max-width:1180px;margin:20px auto;padding:0 15px}
          .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}.stat{background:var(--card);border-radius:14px;padding:17px;box-shadow:var(--shadow);border-right:4px solid var(--p)}.stat b{font-size:25px;display:block;color:var(--p)}.stat span{color:var(--muted);font-size:13px}
          .toolbar,.card{background:var(--card);border-radius:15px;box-shadow:var(--shadow);padding:17px;margin-bottom:15px}.toolbar{display:flex;gap:9px;flex-wrap:wrap}.search{flex:1;min-width:220px}
          input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px;background:#fff;color:var(--text);outline:none}input:focus,select:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px #07584612}textarea{min-height:85px;resize:vertical}
          .btn{border:0;border-radius:9px;padding:11px 15px;font-weight:bold}.primary{background:var(--p);color:#fff}.gold{background:var(--gold);color:#17211f}.soft{background:#edf3f1;color:var(--p)}.danger{background:#fdecea;color:var(--danger)}
          .profile{display:grid;grid-template-columns:90px 1fr auto;gap:16px;align-items:center}.avatar{width:90px;height:90px;border-radius:50%;background:#e5f0ed;border:3px solid var(--gold);display:grid;place-items:center;font-size:40px}.profile h2{margin:0 0 5px;color:var(--p)}.profile p{margin:0;color:var(--muted)}
          .tabs{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.tab{white-space:nowrap;background:#eaf0ee;color:var(--p);border:0;padding:10px 14px;border-radius:9px}.tab.active{background:var(--p);color:#fff}
          .section{display:none}.section.active{display:block}.title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.title h2{margin:0;color:var(--p);font-size:19px}
          .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:13px;margin-bottom:5px;color:#4f5d59}.wide{grid-column:1/-1}
          .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
          .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}.table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{padding:11px;border-bottom:1px solid var(--line);text-align:right;font-size:13px}.table th{background:#f1f5f3;color:var(--p)}.table tr:last-child td{border-bottom:0}
          .empty{text-align:center;padding:25px;color:var(--muted)}.badge{display:inline-block;padding:5px 8px;border-radius:20px;background:#e8f4ef;color:var(--p);font-size:12px}
          footer{text-align:center;color:var(--muted);font-size:12px;padding:18px}
          .toast{position:fixed;bottom:20px;right:20px;background:#173c34;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 8px 25px #0003;display:none;z-index:10}
          .modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:15px;z-index:20}.modal.show{display:flex}.modalbox{background:#fff;border-radius:15px;max-width:600px;width:100%;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{background:#eee;border:0;border-radius:8px;padding:7px 10px}
          body.dark{--bg:#101816;--card:#17221f;--text:#e8efed;--muted:#a8b5b1;--line:#2d3a36}body.dark input,body.dark select,body.dark textarea{background:#111a18;color:#fff}body.dark .table th{background:#202c29}
          @media(max-width:700px){.head{align-items:flex-start}.stats{grid-template-columns:1fr 1fr}.profile{grid-template-columns:70px 1fr}.profile .actions{grid-column:1/-1}.avatar{width:70px;height:70px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.stats .stat:last-child{grid-column:1/-1}}
          @media print{header,.stats,.toolbar,.tabs,.actions,.no-print,footer{display:none!important}.card{box-shadow:none;border:1px solid #ddd}.section{display:block!important}.profile{border:1px solid #ddd}}

          header{padding-top:calc(20px + env(safe-area-inset-top,0px))}
          footer{padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
          .toast{bottom:calc(20px + env(safe-area-inset-bottom,0px))}
          .lock{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));background:linear-gradient(160deg,#043f35,#0b715d);color:#fff;text-align:center}
          .lock.off{display:none}
          .lockbox{width:100%;max-width:340px}
          .lockmark{width:84px;height:84px;margin:0 auto 20px;border:2px solid #e9c45a;border-radius:50%;display:grid;place-items:center;font-size:36px;background:#ffffff14}
          .lockbox h2{margin:0 0 8px;font-size:22px}
