          .lockbox input::placeholder{letter-spacing:0;font-size:14px;color:#d8eeea99}
          .lockbox [hidden]{display:none}
          #lockErr{color:#ffd9d4;min-height:22px;margin:14px 0 0;font-size:13px}
          </style>
          </head>
          <body>
          <div id="lock" class="lock" role="dialog" aria-modal="true" aria-label="شاشة القفل">
          <div class="lockbox">
          <div class="lockmark" aria-hidden="true">🔒</div>
          <h2>بنك المعلومات الشخصية</h2>
          <p id="lockMsg">جارٍ التحقق…</p>
