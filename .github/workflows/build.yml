          <div class="actions no-print">
          <button class="btn primary" onclick="save()">💾 حفظ البيانات</button><button class="btn soft" onclick="newPerson()">موظف جديد</button><button class="btn gold" onclick="window.print()">🖨️ طباعة</button><button class="btn danger" onclick="deletePerson()">حذف الموظف</button>
          </div>
          </div>

          <div class="card no-print"><div class="title"><h2>قائمة الموظفين</h2></div><div id="peopleList"></div></div>
          </main>

          <footer>بنك المعلومات الشخصية © 2026 — يعمل محليًا على جهازك</footer>
          <div id="toast" class="toast"></div>

          <div id="docModal" class="modal"><div class="modalbox">
          <div class="modalhead"><h2>إضافة ورقة ثبوتية</h2><button class="close" onclick="closeModal('docModal')">✕</button></div>
          <div class="grid">
          <div class="field"><label>نوع الوثيقة</label><select id="docType"><option>البطاقة الوطنية</option><option>بطاقة السكن</option><option>هوية الأحوال المدنية</option><option>شهادة الجنسية</option><option>جواز السفر</option><option>هوية الموظف</option><option>أخرى</option></select></div>
          <div class="field"><label>رقم الوثيقة</label><input id="docNo"></div><div class="field"><label>تاريخ الإصدار</label><input id="docDate" type="date"></div><div class="field"><label>تاريخ الانتهاء</label><input id="docExpiry" type="date"></div><div class="field"><label>جهة الإصدار</label><input id="docFrom"></div>
          </div><div class="actions"><button class="btn primary" onclick="addDoc()">إضافة</button><button class="btn soft" onclick="closeModal('docModal')">إلغاء</button></div>
          </div></div>

          <div id="bookModal" class="modal"><div class="modalbox">
          <div class="modalhead"><h2>إضافة كتاب رسمي</h2><button class="close" onclick="closeModal('bookModal')">✕</button></div>
          <div class="grid">
          <div class="field"><label>نوع الكتاب</label><select id="bookType"><option>كتاب رسمي</option><option>أمر إداري</option><option>أمر وزاري</option><option>تأييد</option><option>تنسيب</option><option>نقل</option><option>ترفيع</option><option>علاوة</option><option>أخرى</option></select></div>
          <div class="field"><label>رقم الكتاب</label><input id="bookNo"></div><div class="field"><label>تاريخ الكتاب</label><input id="bookDate" type="date"></div><div class="field"><label>جهة الإصدار</label><input id="bookFrom"></div><div class="field"><label>موجه إلى</label><input id="bookTo"></div><div class="field"><label>الموضوع</label><input id="bookSubject"></div><div class="field wide"><label>إرفاق صورة / PDF</label><input id="bookFile" type="file" accept="image/*,.pdf"></div>
          </div><div class="actions"><button class="btn primary" onclick="addBook()">إضافة</button><button class="btn soft" onclick="closeModal('bookModal')">إلغاء</button></div>
          </div></div>

          <script>
          const F=["name","mother","birth","birthPlace","gender","marital","children","phone","email","employee","job","grade","step","appointment","start","service","affiliation","school","directorate","department","section","province","district","lastRaise","raiseDate","promotion","nextDate","educationLevel","specialty","university","graduation","course","courseOrg","courseDate","courseDuration","address","notes"];
          let people=[],current=-1,docs=[],books=[];
          const $=id=>document.getElementById(id);
          const DB_NAME="personal-bank-db", DB_VERSION=1, STORE="employees";
          let dbReady;

          function openDB(){
            if(!dbReady) dbReady=new Promise((resolve,reject)=>{
              const req=indexedDB.open(DB_NAME,DB_VERSION);
              req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:"_id",autoIncrement:true});};
              req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
            });
            return dbReady;
          }
          async function dbAll(){const db=await openDB();return new Promise((resolve,reject)=>{const r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error);});}
          async function dbPut(item){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,"readwrite");const r=tx.objectStore(STORE).put(item);r.onsuccess=()=>resolve(r.result);tx.onerror=()=>reject(tx.error);});}
          async function dbDelete(id){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});}
          async function dbReplaceAll(items){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,"readwrite"),s=tx.objectStore(STORE);s.clear();items.forEach(p=>{const x={...p};delete x._id;s.add(x);});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});}
          async function load(){try{people=await dbAll();}catch(e){people=[];toast("تعذر فتح قاعدة البيانات المحلية");}renderPeople();updateStats();if(people.length)openPerson(0);}
          async function save(){
            let p=read();if(!p.name.trim()){toast("اكتب اسم الموظف أولاً");return;}
            p.docs=docs;p.books=books;
            try{
              if(current<0){const id=await dbPut(p);p._id=id;people.push(p);current=people.length-1;}
              else{p._id=people[current]._id;await dbPut(p);people[current]=p;}
              renderPeople();updateStats();preview();toast("تم حفظ الملف على الجهاز");
            }catch(e){toast("فشل الحفظ، تحقق من مساحة الجهاز");}
          }
          function read(){let o={};F.forEach(x=>o[x]=$(x).value);return o;}
          function fill(p){F.forEach(x=>$(x).value=p?.[x]||"");docs=p?.docs||[];books=p?.books||[];preview();renderDocs();renderBooks();}
          function newPerson(){current=-1;fill({});toast("تم فتح ملف جديد");window.scrollTo(0,0);}
          function openPerson(i){current=i;fill(people[i]);toast("تم فتح ملف الموظف");window.scrollTo(0,0);}
          async function deletePerson(){if(current<0){toast("حدد موظفاً أولاً");return;}if(!confirm("حذف ملف الموظف؟"))return;try{await dbDelete(people[current]._id);people.splice(current,1);newPerson();renderPeople();updateStats();toast("تم الحذف");}catch(e){toast("تعذر حذف الملف");}}
          function preview(){$("pName").textContent=$("name").value||"اسم الموظف";$("pInfo").textContent=($("job").value||"العنوان الوظيفي")+" — "+($("school").value||"المدرسة / المديرية");}
          function renderPeople(){let q=($("search").value||"").toLowerCase(),a=people.map((p,i)=>({p,i})).filter(x=>((x.p.name||"")+" "+(x.p.employee||"")).toLowerCase().includes(q)),b=$("peopleList");if(!a.length){b.innerHTML='<div class="empty">لا توجد ملفات موظفين</div>';return;}b.innerHTML='<div class="table-wrap"><table class="table"><thead><tr><th>الاسم</th><th>الرقم الوظيفي</th><th>الوظيفة</th><th>المدرسة</th><th></th></tr></thead><tbody>'+a.map(x=>'<tr><td>'+esc(x.p.name)+'</td><td>'+esc(x.p.employee)+'</td><td>'+esc(x.p.job)+'</td><td>'+esc(x.p.school)+'</td><td><button class="btn soft" onclick="openPerson('+x.i+')">فتح</button></td></tr>').join("")+'</tbody></table></div>';}
          function addDoc(){if(!$("docNo").value){toast("أدخل رقم الوثيقة");return;}docs.push({type:$("docType").value,no:$("docNo").value,date:$("docDate").value,expiry:$("docExpiry").value,from:$("docFrom").value});renderDocs();closeModal("docModal");clearIds(["docNo","docDate","docExpiry","docFrom"]);toast("تمت إضافة الوثيقة");}
          function renderDocs(){let t=$("docsTable");if(!docs.length){t.innerHTML='<tr><td colspan="6" class="empty">لا توجد أوراق ثبوتية</td></tr>';return;}t.innerHTML=docs.map((d,i)=>'<tr><td><span class="badge">'+esc(d.type)+'</span></td><td>'+esc(d.no)+'</td><td>'+esc(d.date)+'</td><td>'+esc(d.expiry)+'</td><td>'+esc(d.from)+'</td><td><button class="btn danger" onclick="removeDoc('+i+')">حذف</button></td></tr>').join("");}
          function removeDoc(i){docs.splice(i,1);renderDocs();toast("تم حذف الوثيقة");}
          function fileAsDataURL(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});}
          async function addBook(){
            let f=$("bookFile").files[0];if(!$("bookNo").value&&!$("bookSubject").value){toast("أدخل رقم الكتاب أو موضوعه");return;}
            if(f && f.size>8*1024*1024){toast("حجم المرفق أكبر من 8 ميغابايت");return;}
            try{books.push({type:$("bookType").value,no:$("bookNo").value,date:$("bookDate").value,from:$("bookFrom").value,to:$("bookTo").value,subject:$("bookSubject").value,file:f?f.name:"",fileData:f?await fileAsDataURL(f):null});renderBooks();closeModal("bookModal");clearIds(["bookNo","bookDate","bookFrom","bookTo","bookSubject"]);$("bookFile").value="";toast("تم إرفاق الكتاب داخل قاعدة البيانات المحلية");}
            catch(e){toast("تعذر قراءة المرفق");}
          }
          function renderBooks(){let t=$("booksTable");if(!books.length){t.innerHTML='<tr><td colspan="8" class="empty">لا توجد كتب رسمية</td></tr>';return;}t.innerHTML=books.map((b,i)=>'<tr><td><span class="badge">'+esc(b.type)+'</span></td><td>'+esc(b.no)+'</td><td>'+esc(b.date)+'</td><td>'+esc(b.subject)+'</td><td>'+esc(b.from)+'</td><td>'+esc(b.to)+'</td><td>'+(b.fileData?'<button class="btn soft" onclick="openAttachment('+i+')">'+esc(b.file||"فتح المرفق")+'</button>':esc(b.file||"—"))+'</td><td><button class="btn danger" onclick="removeBook('+i+')">حذف</button></td></tr>').join("");}
          function removeBook(i){books.splice(i,1);renderBooks();toast("تم حذف الكتاب");}
          function clearIds(a){a.forEach(x=>$(x).value="");}
          function tab(btn,id){document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));btn.classList.add("active");$(id).classList.add("active");}
          function openModal(id){$(id).classList.add("show");}function closeModal(id){$(id).classList.remove("show");}
          function updateStats(){$("statPeople").textContent=people.length;$("statBooks").textContent=people.reduce((n,p)=>n+(p.books||[]).length,0);$("statDocs").textContent=people.reduce((n,p)=>n+(p.docs||[]).length,0);}
          async function backup(){
            const clean=people.map(p=>{const x={...p};delete x._id;return x;});
            try{
              await deliverFile("personal-bank-backup-"+new Date().toISOString().slice(0,10)+".json",{text:JSON.stringify(clean,null,2),mime:"application/json"});
              toast("تم إنشاء النسخة الاحتياطية");
            }catch(e){if(!/cancel/i.test(String(e&&e.message)))toast("تعذر إنشاء النسخة الاحتياطية");}
          }
          async function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=async()=>{try{let data=JSON.parse(r.result);if(!Array.isArray(data))throw Error("invalid");await dbReplaceAll(data);people=await dbAll();renderPeople();updateStats();newPerson();toast("تم استرجاع البيانات");}catch(x){toast("ملف النسخة الاحتياطية غير صالح");}};r.readAsText(f);e.target.value="";}
          function toggleDark(){document.body.classList.toggle("dark");localStorage.setItem("pro_dark",document.body.classList.contains("dark"));}
          function toast(t){let x=$("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",2600);}
          function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
          F.forEach(x=>$(x).addEventListener("input",preview));
          if(localStorage.getItem("pro_dark")==="true")document.body.classList.add("dark");
          if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
          /* ===== iOS native bridge (Capacitor) ===== */
          const Cap=window.Capacitor;
          const isNative=!!(Cap&&Cap.isNativePlatform&&Cap.isNativePlatform());
          let Bio=null,FS=null,Share=null;
          if(isNative){try{Bio=Cap.registerPlugin("BiometricAuthNative");FS=Cap.registerPlugin("Filesystem");Share=Cap.registerPlugin("Share");}catch(e){}}
          function safeName(s){return String(s||"file").replace(/[\\\/:*?"<>|\r\n]+/g,"_").slice(0,80);}
          async function deliverFile(name,o){
            if(isNative&&FS&&Share){
              const enc=o.dataUrl?{}:{encoding:"utf8"};
              const data=o.dataUrl?(o.dataUrl.split(",")[1]||""):o.text;
              const r=await FS.writeFile({path:safeName(name),data,directory:"CACHE",...enc});
              await Share.share({title:name,url:r.uri,dialogTitle:name});
              return;
            }
            const href=o.dataUrl||URL.createObjectURL(new Blob([o.text],{type:o.mime||"application/octet-stream"}));
            const a=document.createElement("a");a.href=href;a.download=name;document.body.appendChild(a);a.click();a.remove();
            if(!o.dataUrl)setTimeout(()=>URL.revokeObjectURL(href),1000);
          }
          async function openAttachment(i){
            const b=books[i];if(!b||!b.fileData)return;
            try{await deliverFile(b.file||"attachment",{dataUrl:b.fileData});}
            catch(e){if(!/cancel/i.test(String(e&&e.message)))toast("تعذر فتح المرفق");}
          }

          /* ===== App lock: Face ID (native) or PIN (browser) ===== */
          const AUTO_LOCK_MS=30000;
          let lockMode=null,authBusy=false,hiddenAt=0,pinFails=0,pinBlockedUntil=0;
          const lockEl=$("lock");
          function showLock(){lockEl.classList.remove("off");}
          function hideLock(){lockEl.classList.add("off");hiddenAt=0;$("lockErr").textContent="";}
          function lockErr(t){$("lockErr").textContent=t||"";}
          function pinSetupPending(){return lockMode==="pin"&&!localStorage.getItem("pro_pin");}
          async function initLock(){
            if(isNative&&Bio){
              try{const i=await Bio.checkBiometry();if(i.isAvailable||i.deviceIsSecure)lockMode="bio";}catch(e){}
            }
            if(!lockMode)lockMode="pin";
            if(lockMode==="bio"){
              $("lockMsg").textContent="افتح التطبيق بـ Face ID أو برمز الجهاز";
              $("lockBio").hidden=false;
              unlockNative();
            }else{
              const first=pinSetupPending();
              $("lockMsg").textContent=first?"أنشئ رمزاً من 4 إلى 6 أرقام لحماية البيانات":"أدخل الرمز لفتح التطبيق";
              $("pin2").hidden=!first;$("pinBtn").textContent=first?"حفظ الرمز":"فتح";
              $("lockPin").hidden=false;
            }
          }
          async function unlockNative(){
            if(authBusy)return;authBusy=true;lockErr("");
            try{
              await Bio.authenticate({reason:"فتح بنك المعلومات الشخصية",cancelTitle:"إلغاء",allowDeviceCredential:true,iosFallbackTitle:"استخدام رمز الجهاز"});
              hideLock();
            }catch(e){lockErr("لم يتم التحقق. اضغط الزر للمحاولة مرة أخرى.");}
            finally{authBusy=false;}
          }
          async function hashPin(pin,salt){
            const d=new TextEncoder().encode(salt+":"+pin);
            const h=await crypto.subtle.digest("SHA-256",d);
            return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,"0")).join("");
          }
          async function submitPin(){
            const p1=$("pin1").value.trim(),saved=localStorage.getItem("pro_pin");
            try{
              if(!saved){
                if(!/^\d{4,6}$/.test(p1)){lockErr("الرمز يجب أن يكون من 4 إلى 6 أرقام");return;}
                if(p1!==$("pin2").value.trim()){lockErr("الرمزان غير متطابقين");return;}
                const salt=Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b=>b.toString(16).padStart(2,"0")).join("");
                localStorage.setItem("pro_pin",JSON.stringify({salt,hash:await hashPin(p1,salt)}));
                $("pin1").value=$("pin2").value="";$("pin2").hidden=true;$("pinBtn").textContent="فتح";
                hideLock();toast("تم حفظ الرمز");return;
              }
              if(Date.now()<pinBlockedUntil){lockErr("محاولات كثيرة. انتظر قليلاً ثم حاول مرة أخرى.");return;}
              const o=JSON.parse(saved);
              if(await hashPin(p1,o.salt)===o.hash){pinFails=0;$("pin1").value="";hideLock();}
              else{
                pinFails++;$("pin1").value="";
                if(pinFails>=5){pinFails=0;pinBlockedUntil=Date.now()+30000;lockErr("محاولات كثيرة. انتظر 30 ثانية.");}
                else lockErr("الرمز غير صحيح");
              }
            }catch(e){lockErr("تعذر التحقق من الرمز على هذا المتصفح.");}
          }
          document.addEventListener("visibilitychange",()=>{
            if(authBusy||!lockMode)return;
            if(document.hidden){hiddenAt=Date.now();showLock();}
            else if(pinSetupPending())return;
            else if(Date.now()-hiddenAt>AUTO_LOCK_MS){$("pin1").value="";if(lockMode==="bio")unlockNative();}
            else hideLock();
          });
          initLock();

          load();
          </script>
          </body>
          </html>
          END_OF_INDEX_FILE

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate app icon
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet pillow
          .venv/bin/python make_icon.py

      - name: Create iOS project
        run: |
          npx cap add ios --packagemanager CocoaPods
          npx cap sync ios

      - name: Patch Info.plist and icon
        run: bash patch-ios.sh

      - name: Archive (no signing)
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=1.0 \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/PersonalBank.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/PersonalBank.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: PersonalBank-ipa
          path: PersonalBank.ipa
          retention-days: 30
