          </section>

          <section id="notes" class="section">
          <div class="title"><h2>العنوان والملاحظات</h2></div>
          <div class="grid">
          <div class="field wide"><label>العنوان الكامل</label><textarea id="address"></textarea></div>
          <div class="field wide"><label>ملاحظات إدارية</label><textarea id="notes"></textarea></div>
          </div>
