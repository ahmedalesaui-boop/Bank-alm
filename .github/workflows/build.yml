          <div class="brand"><div class="logo">م</div><div><h1>بنك المعلومات الشخصية</h1><p>نظام إدارة البيانات الشخصية والوظيفية</p></div></div>
          <button onclick="toggleDark()">☾ الوضع الليلي</button>
