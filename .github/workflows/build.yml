          <div id="lockPin" hidden>
          <input id="pin1" type="password" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="الرمز" onkeydown="if(event.key==='Enter')submitPin()">
          <input id="pin2" type="password" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="أعد كتابة الرمز" hidden onkeydown="if(event.key==='Enter')submitPin()">
          <button id="pinBtn" class="btn gold" onclick="submitPin()">فتح</button>
